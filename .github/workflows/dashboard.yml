name: Dashboard

on:
  push:
    paths:
      - "apps/dashboard/**"
      - "skills/**/SKILL.md"
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "skills/**/SKILL.md"

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test --workspace=cohorio-dashboard

      - name: Lint
        run: npm run lint --workspace=cohorio-dashboard
